---
- name: Verify Redmine
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Run the checks shared by all Redmine scenarios
      ansible.builtin.include_tasks:
        file: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}/molecule/verify_tasks.yml"

    # The role builds `redmine_config_database_host_postgres` out of
    # `redmine_database_postgres_socket_path_container` and writes it into
    # database.yml as `host:` (libpq reads a leading-slash host as a socket
    # directory). Reading it back off the live connection is what proves the
    # Unix-socket wiring, rather than some TCP connection that happened to
    # work, is what Redmine is using.
    - name: Assert that the live connection uses the socket the role mounts
      ansible.builtin.assert:
        that:
          - redmine_reported.database.host == redmine_defaults.redmine_database_postgres_socket_path_container
          - redmine_reported.database.username == redmine_database_postgres_username
          - redmine_reported.database.database == redmine_database_name
        fail_msg: >-
          Redmine's live connection is {{ redmine_reported.database }}, not the
          `{{ redmine_defaults.redmine_database_postgres_socket_path_container }}` socket directory,
          `{{ redmine_database_postgres_username }}` user and `{{ redmine_database_name }}`
          database the role configures
        success_msg: "Redmine's live connection uses the socket, user and database the role configures"

    # Verify Redmine stores data on the database actually by asking Postgres for the project that
    # was created inside it.
    #
    # The query goes in as the role's own database user, so the credentials
    # the role configured are under test here too.
    - name: Read the projects Redmine stored, out of the Postgres database
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - "--env=PGPASSWORD={{ redmine_database_postgres_password }}"
          - "{{ postgres_identifier | default('postgres') }}"
          - psql
          - "--username={{ redmine_database_postgres_username }}"
          - "--dbname={{ redmine_database_name }}"
          - --tuples-only
          - --no-align
          - "--command=SELECT identifier FROM projects ORDER BY id"
      register: redmine_postgres_projects
      changed_when: false

    - name: Assert that the Postgres database holds the project that was created
      ansible.builtin.assert:
        that: redmine_postgres_projects.stdout_lines == [redmine_molecule_project_identifier]
        fail_msg: >-
          The `{{ redmine_database_name }}` database holds {{ redmine_postgres_projects.stdout_lines }},
          not the `{{ redmine_molecule_project_identifier }}` that was created
        success_msg: "The `{{ redmine_database_name }}` Postgres database holds the project that was created"

    - name: Check whether Redmine also wrote the image entrypoint's SQLite database
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - "{{ redmine_defaults.redmine_identifier }}"
          - test
          - -e
          - /usr/src/redmine/sqlite/redmine.db
      register: redmine_sqlite_fallback
      changed_when: false
      failed_when: false

    # The counterpart of the checks above. If the role's database.yml never
    # reached the container, the entrypoint writes one of its own and falls
    # back to SQLite at this path - and everything visible from the outside
    # still looks perfectly healthy.
    - name: Assert that Redmine did not fall back to SQLite
      ansible.builtin.assert:
        that: redmine_sqlite_fallback.rc != 0
        fail_msg: "Redmine wrote a SQLite database at `/usr/src/redmine/sqlite/redmine.db` despite being pointed at Postgres"
        success_msg: "Redmine wrote no SQLite fallback, so Postgres is its only store"

    # This scenario is the one where `redmine_container_http_port` differs from
    # the port the host publishes, which is what makes the shared HTTP check a
    # real test of that variable reaching the process. Naming it here as well
    # keeps the intent from being tidied away by a later edit that "aligns the
    # scenarios".
    - name: Assert that this scenario runs Redmine on a non-default port
      ansible.builtin.assert:
        that:
          - redmine_container_http_port | int != redmine_defaults.redmine_container_http_port | int
          - redmine_container_http_port | int != redmine_container_http_host_bind_port | int
        fail_msg: >-
          This scenario is meant to run Redmine on a port other than the role's default
          ({{ redmine_defaults.redmine_container_http_port }}) and other than the published
          host port ({{ redmine_container_http_host_bind_port }}), so that the shared HTTP check
          proves `redmine_container_http_port` reaches the process
        success_msg: >-
          Redmine was served through host port {{ redmine_container_http_host_bind_port }}
          while listening on {{ redmine_container_http_port }} inside the container
