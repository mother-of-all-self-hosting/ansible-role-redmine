---
- name: Verify Redmine systemd service
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Wait for Redmine service to become active (up to 180s)
      ansible.builtin.systemd:
        name: redmine.service
      register: redmine_service
      until: redmine_service.status.ActiveState == 'active'
      retries: 36
      delay: 5

    - name: Assert Redmine service is active
      ansible.builtin.assert:
        that: redmine_service.status.ActiveState == 'active'
        fail_msg: "redmine.service not active ({{ redmine_service.status.ActiveState }})"
        success_msg: "redmine.service is active"

    - name: Retrieve Redmine service log for debugging
      when: redmine_debug_service_enabled | bool
      ansible.builtin.command:
        cmd: journalctl -xeu redmine.service
      changed_when: false

    - name: Wait for Redmine HTTP endpoint to respond (up to 10m)
      ansible.builtin.uri:
        url: "http://localhost:3000/"
        method: GET
        status_code: [200, 302]
        follow_redirects: none
      register: redmine_endpoint
      until: redmine_endpoint.status in [200, 302]
      retries: 120
      delay: 5

    - name: Assert Redmine HTTP endpoint responds
      ansible.builtin.assert:
        that: redmine_endpoint.status in [200, 302]
        fail_msg: "Redmine did not respond as expected ({{ redmine_endpoint.status | default('no response') }})"
        success_msg: "Redmine responded with {{ redmine_endpoint.status }}"

    - name: Show Redmine systemd service status summary
      ansible.builtin.debug:
        msg:
          - "Redmine systemd: {{ redmine_service.status.ActiveState }}"
          - "Redmine HTTP: {{ redmine_endpoint.status }}"
