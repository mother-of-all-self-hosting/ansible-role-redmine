---
- name: Verify Redmine
  hosts: all
  become: true
  gather_facts: false

  vars:
    redmine_verify_units:
      - redmine.service

  tasks:
    - name: Verify that Redmine works
      block:
        - name: Run the checks shared by all Redmine scenarios
          ansible.builtin.include_tasks:
            file: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}/molecule/verify_tasks.yml"

        # Verify Redmine stores data on the database actually by reading the data straight out of that file.
        - name: Assert that the live connection reads the file the role configured
          ansible.builtin.assert:
            that: redmine_reported.database.database == redmine_defaults.redmine_database_filename
            fail_msg: >-
              Redmine's live connection reads `{{ redmine_reported.database.database }}`,
              not the `{{ redmine_defaults.redmine_database_filename }}` the role configures
              (`sqlite/redmine.db` would mean the image entrypoint's own fallback)
            success_msg: "Redmine's live connection reads `{{ redmine_defaults.redmine_database_filename }}`, as the role configures"

        - name: Read the projects Redmine stored, out of its SQLite database
          ansible.builtin.command:
            argv:
              - python3
              - "-c"
              - |
                import sqlite3
                import sys

                connection = sqlite3.connect('file:%s?mode=ro' % sys.argv[1], uri=True)
                print(','.join(row[0] for row in connection.execute('SELECT identifier FROM projects ORDER BY id')))
              - "{{ redmine_molecule_sqlite_path }}"
          register: redmine_sqlite_projects
          changed_when: false

        - name: Assert that the SQLite database holds the project that was created
          ansible.builtin.assert:
            that: redmine_sqlite_projects.stdout.split(',') == [redmine_molecule_project_identifier]
            fail_msg: >-
              `{{ redmine_molecule_sqlite_path }}` holds `{{ redmine_sqlite_projects.stdout }}`,
              not the `{{ redmine_molecule_project_identifier }}` that was created
            success_msg: "The SQLite database at `{{ redmine_molecule_sqlite_path }}` holds the project that was created"

        - name: Verify nothing was quietly restarting while all of that was being checked
          when: "redmine_restarts_check_enabled | bool"
          block:
            # `Restart=always` means the unit reads `active` while it is crash-looping,
            # so `active` on its own says very little. The window has to be watched with
            # everything already answering.
            - name: Sample the restart counters
              ansible.builtin.systemd_service:
                name: "{{ item }}"
              register: redmine_restarts_before
              loop: "{{ redmine_verify_units }}"

            # Comfortably longer than the unit's `RestartSec=30`, so a crash loop has to
            # tick at least once inside the window.
            - name: Watch the services for 45 seconds
              ansible.builtin.pause:
                seconds: 45

            - name: Sample the restart counters again
              ansible.builtin.systemd_service:
                name: "{{ item }}"
              register: redmine_restarts_after
              loop: "{{ redmine_verify_units }}"

            - name: Assert no service restarted while it was up
              ansible.builtin.assert:
                that:
                  - redmine_restarts_after.results | map(attribute='status.NRestarts') | list == redmine_restarts_before.results | map(attribute='status.NRestarts') | list
                  - redmine_restarts_after.results | map(attribute='status.ActiveState') | unique | list == ['active']
                fail_msg: >-
                  A service restarted while it was supposedly up, so `active` was hiding a crash loop.
                  Before:
                  {% for unit, restarts in redmine_verify_units | zip(redmine_restarts_before.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %},
                  after:
                  {% for unit, restarts in redmine_verify_units | zip(redmine_restarts_after.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %}
                success_msg: >-
                  None of the services restarted over 45 seconds of watching (restarts so far:
                  {% for unit, restarts in redmine_verify_units | zip(redmine_restarts_after.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %})

      rescue:
        # Whatever went wrong, the reason is almost always in the systemd service log.
        - name: Retrieve the Redmine systemd service log
          ansible.builtin.command:
            cmd: journalctl --no-pager --output=cat --unit=redmine.service
          register: redmine_service_log
          changed_when: false

        - name: Show the Redmine systemd service log
          ansible.builtin.debug:
            var: redmine_service_log.stdout_lines

        - name: Fail because verification did not pass
          ansible.builtin.fail:
            msg: "Redmine verification failed. The systemd service log is printed above."
